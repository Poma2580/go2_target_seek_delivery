schema_version: 1
execution:
  gazebo_gui: false
  rqt: false
  robot_startup:
    world_to_first_delay_sec: 3.0
    inter_robot_delay_sec: 3.0
    enable_lidar: false
  attitude_check:
    enabled: true
    settle_delay_sec: 3.0
    roll_limit_deg: 90.0
    sample_frames: 5
    timeout_sec: 10.0
    max_restarts: 3
    restart_delay_sec: 1.0
suite_id: T1-SMOKE
formal: false
scenes: [city]
routes: [rectangle]
pose_groups: [smoke_default]
inline_pose_groups:
  smoke_default:
    resolved: true
    robots:
      go2_1: {x: -30.0, y: -10.0, z: 0.30, yaw: -1.54}
      go2_2: {x: -20.0, y: 4.0, z: 0.40, yaw: 0.0}
      go2_3: {x: -5.0, y: 35.0, z: 0.40, yaw: 0.0}
evaluation_rate_hz: 2.0
evaluation_duration_sec: 30.0
match_timeout_sec: 0.4
startup_timeout_sec: 120.0
role_timeout_sec: 60.0
data_ready_timeout_sec: 30.0
visibility_method: camera_projection
consider_occlusion: false
perception_mode: selected_robot
min_camera_depth_m: 0.3
max_camera_depth_m: 25.0
