schema_version: 1
scene: city

world:
  path: QY_MODEL/target_seek

dynamic_target:
  model_name: walking_target
  service_prefix: /walking_target
  loop: true
  speed: 0.15
  turn_duration: 2.0
  route:
    - {x: -13.0, y: 4.0}
    - {x: 41.0, y: 4.0}
    - {x: 41.0, y: 36.0}
    - {x: -13.0, y: 36.0}

robots:
  go2_1:
    spawn: {x: -15.0, y: 4.0, z: 0.30, yaw: 0.0}
    sensors: {lidar: false, camera: false}
  go2_2:
    # go2_1 yaw=0: default follower slot is +2 m forward, +2 m left.
    spawn: {x: -13.0, y: 6.0, z: 0.30, yaw: 0.0}
    sensors: {lidar: false, camera: false}
  go2_3:
    # go2_1 yaw=0: default follower slot is +2 m forward, -2 m left.
    spawn: {x: -13.0, y: 2.0, z: 0.30, yaw: 0.0}
    sensors: {lidar: false, camera: false}
