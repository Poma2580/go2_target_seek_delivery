schema_version: 1
scene: airport

world:
  path: KD_MODEL/world/airport

map:
  package: multi_go2_waypoint
  yaml: maps/airport.yaml

target:
  x: 80.0
  y: -25.0
  yaw: -1.0

encircle:
  # 保持旧版 A* 的请求半径；在膨胀地图中不可行时会自动向外扩张。
  radius: 3.0

robots:
  go2_1:
    spawn: {x: 60.0, y: -4.0, z: 0.50, yaw: 0.0}
    sensors: {lidar: false, camera: false}
  go2_2:
    spawn: {x: 70.0, y: 10.0, z: 0.50, yaw: 0.0}
    sensors: {lidar: false, camera: false}
  go2_3:
    spawn: {x: 95.0, y: -25.0, z: 0.50, yaw: 0.0}
    sensors: {lidar: false, camera: false}
