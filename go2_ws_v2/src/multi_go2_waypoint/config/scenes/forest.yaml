schema_version: 1
scene: forest

world:
  path: KD_MODEL/world/forestV3.world

# forest 尚未提供与 airport 同标准的离线栅格地图。使用 A* 时请通过 map_yaml 指定地图。
map: null

# MADDPG 森林测试的行人从 (-13, 2) 出发，初始朝向 +x。
# 相对队形与 city 完全一致：GO1 在行人后方 2 m，GO2/GO3 在前方左右各 2 m。
target: {x: -13.0, y: 2.0, yaw: 0.0}
encircle: {radius: 2.0}

# 森林障碍更密，使用较保守的控制参数。
controller:
  reach_threshold: 0.35
  yaw_threshold: 0.10
  turn_in_place_thresh: 0.70
  max_linear: 0.40
  max_angular: 0.80
  k_linear: 0.60
  k_angular: 1.50
  control_period: 0.05

robots:
  go2_1:
    spawn: {x: -15.0, y: 2.0, z: 0.80, yaw: 0.0}
    sensors: {lidar: true, camera: true}
  go2_2:
    spawn: {x: -13.0, y: 4.0, z: 0.80, yaw: 0.0}
    sensors: {lidar: true, camera: true}
  go2_3:
    spawn: {x: -13.0, y: 0.0, z: 0.80, yaw: 0.0}
    sensors: {lidar: true, camera: true}
