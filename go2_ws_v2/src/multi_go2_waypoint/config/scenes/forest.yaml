schema_version: 1
scene: forest

world:
  path: KD_MODEL/world/forestV3.world

# forest 尚未提供与 airport 同标准的离线栅格地图。使用 A* 时请通过 map_yaml 指定地图。
map: null

# forestV3.world 中的 cessna_c172。
target: {x: 8.4, y: 38.3395, yaw: 1.59854}
encircle: {radius: 4.0}

# 森林障碍更密，使用较保守的控制参数。
controller:
  reach_threshold: 0.35
  yaw_threshold: 0.10
  turn_in_place_thresh: 0.70
  max_linear: 0.40
  max_angular: 0.80
  k_linear: 0.60
  k_angular: 1.50
  control_period: 0.05

robots:
  go2_1:
    spawn: {x: 20.0, y: 18.0, z: 0.80, yaw: 2.19}
    sensors: {lidar: false, camera: false}
  go2_2:
    spawn: {x: -8.0, y: 42.0, z: 0.80, yaw: 0.0}
    sensors: {lidar: false, camera: false}
  go2_3:
    spawn: {x: 36.0, y: 40.0, z: 0.80, yaw: -2.92}
    sensors: {lidar: false, camera: false}
